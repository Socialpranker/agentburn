[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentburn"
version = "0.13.2"
description = "Which 5-hour window took you out, and where the money goes. Local usage/cost profiler for Claude Code, OpenClaw and Hermes Agent. Zero dependencies, nothing leaves your machine."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ion" }]
keywords = ["claude-code", "usage-limits", "tokens", "cost", "profiler", "ai-agents",
            "hermes-agent", "openclaw", "mcp", "observability"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Socialpranker/agentburn"

[project.scripts]
agentburn = "agentburn.cli:main"

[tool.setuptools.packages.find]
include = ["agentburn*"]
